<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hand-Tracked 3D Particle System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: Arial; font-size: 14px; opacity: 0.8;
    }
  </style>
</head>
<body>
<div id="info">Move your hand → particles react | Open palm = expand | Pinch = switch shape</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<!-- MediaPipe Hands -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/********************
 * SCENE SETUP
 ********************/
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/********************
 * PARTICLES
 ********************/
const PARTICLE_COUNT = 6000;
let geometry = new THREE.BufferGeometry();
let positions = new Float32Array(PARTICLE_COUNT * 3);
let colors = new Float32Array(PARTICLE_COUNT * 3);

const color = new THREE.Color();
for (let i = 0; i < PARTICLE_COUNT; i++) {
  positions[i * 3 + 0] = (Math.random() - 0.5) * 3;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 3;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 3;

  color.setHSL(Math.random(), 1.0, 0.6);
  colors[i * 3 + 0] = color.r;
  colors[i * 3 + 1] = color.g;
  colors[i * 3 + 2] = color.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.04,
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

/********************
 * SHAPE TEMPLATES
 ********************/
let shapeIndex = 0;
const shapes = {
  heart: (i, t) => {
    const a = Math.random() * Math.PI * 2;
    const r = 0.6;
    return [
      r * 16 * Math.pow(Math.sin(a), 3) * 0.04,
      r * (13 * Math.cos(a) - 5 * Math.cos(2 * a)) * 0.04,
      Math.sin(t + i) * 0.3
    ];
  },
  saturn: (i, t) => {
    const a = Math.random() * Math.PI * 2;
    return [
      Math.cos(a) * 1.2,
      Math.sin(a) * 0.2,
      Math.sin(a + t) * 1.2
    ];
  },
  fireworks: (i, t) => {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 1.5;
    return [
      Math.cos(a) * r,
      Math.sin(a) * r,
      Math.sin(t) * r
    ];
  }
};

const shapeKeys = Object.keys(shapes);

/********************
 * HAND TRACKING
 ********************/
let handX = 0, handY = 0;
let pinch = false;

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(results => {
  if (!results.multiHandLandmarks.length) return;

  const lm = results.multiHandLandmarks[0];
  const indexTip = lm[8];
  const thumbTip = lm[4];

  handX = (indexTip.x - 0.5) * 6;
  handY = -(indexTip.y - 0.5) * 6;

  const dx = indexTip.x - thumbTip.x;
  const dy = indexTip.y - thumbTip.y;
  pinch = Math.sqrt(dx * dx + dy * dy) < 0.04;
});

const video = document.createElement('video');
const cam = new Camera(video, {
  onFrame: async () => await hands.send({ image: video }),
  width: 640,
  height: 480
});
cam.start();

/********************
 * ANIMATION LOOP
 ********************/
let lastPinch = false;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (pinch && !lastPinch) {
    shapeIndex = (shapeIndex + 1) % shapeKeys.length;
  }
  lastPinch = pinch;

  const shapeFn = shapes[shapeKeys[shapeIndex]];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const [x, y, z] = shapeFn(i, t);

    positions[i * 3 + 0] += (x + handX - positions[i * 3 + 0]) * 0.05;
    positions[i * 3 + 1] += (y + handY - positions[i * 3 + 1]) * 0.05;
    positions[i * 3 + 2] += (z - positions[i * 3 + 2]) * 0.05;

    const h = (t * 0.1 + i / PARTICLE_COUNT) % 1;
    color.setHSL(h, 1.0, pinch ? 0.8 : 0.5);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;

  particles.rotation.y += 0.001;
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
